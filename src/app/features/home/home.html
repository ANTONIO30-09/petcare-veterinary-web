<app-hero />

<app-video-hero />

<section class="services">
  <div class="services__inner">
    <header class="services__header">
      <h2>Servicios destacados</h2>
      <a class="services__link" routerLink="/servicios">Ver todos los servicios →</a>
    </header>

    @if (featuredServices().length === 0) {
      <p class="services__empty">Cargando servicios…</p>
    } @else {
      <div class="services__grid">
        @for (svc of featuredServices(); track svc.id) {
          <app-service-card [service]="svc" />
        }
      </div>
    }
  </div>
</section>

<app-cta-banner />
