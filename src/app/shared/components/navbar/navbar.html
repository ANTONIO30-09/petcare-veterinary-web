<header class="navbar">
  <div class="navbar__inner">
    <a class="navbar__brand" routerLink="/" aria-label="Ir al inicio de PetCare">
      <span class="navbar__brand-mark" aria-hidden="true">🐾</span>
      <span class="navbar__brand-text">PetCare</span>
    </a>

    <nav class="navbar__links" aria-label="Navegación principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/servicios" routerLinkActive="active">Servicios</a>
      <a routerLink="/especialidades" routerLinkActive="active">Especialidades</a>
      <a routerLink="/ubicaciones" routerLinkActive="active">Ubicaciones</a>
      <a routerLink="/precios" routerLinkActive="active">Precios</a>
      <a routerLink="/nosotros" routerLinkActive="active">Nosotros</a>
      <a routerLink="/contacto" routerLinkActive="active">Contacto</a>
    </nav>

    <a class="navbar__cta" routerLink="/contacto">Agendar cita</a>
  </div>
</header>
